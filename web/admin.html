<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecargaTica · Admin</title>
<style>
  :root {
    --c-primary: #1565F9;
    --c-primary-dark: #0d49c4;
    --c-secondary: #22C55E;
    --c-bg: #FFFFFF;
    --c-bg-soft: #F5F7FB;
    --c-text: #1F2937;
    --c-muted: #6B7280;
    --c-border: #E5E7EB;
    --c-ok: #047857;
    --c-err: #B91C1C;
  }
  *,*::before,*::after { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: var(--c-text); background: var(--c-bg-soft); line-height: 1.5; }
  .brand { font-size: 1.4rem; font-weight: 700; color: var(--c-primary); text-decoration: none; }
  .brand em { color: var(--c-secondary); font-style: normal; }
  section { background: #fff; border: 1px solid var(--c-border); border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  section h2 { font-size: 1rem; margin: 0 0 0.85rem; color: var(--c-text); }
  label { display: block; margin: 0.6rem 0 0.25rem; font-size: 0.85rem; font-weight: 500; }
  input, select { width: 100%; padding: 0.55rem 0.7rem; font-size: 0.95rem; border: 1px solid var(--c-border); border-radius: 8px; font-family: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(21,101,249,0.12); }
  button { margin-top: 0.85rem; padding: 0.6rem 1.1rem; cursor: pointer; background: var(--c-primary); color: #fff; border: none; border-radius: 8px; font-family: inherit; font-weight: 500; transition: background 0.15s; }
  button:hover { background: var(--c-primary-dark); }
  pre { background: var(--c-bg-soft); padding: 0.85rem 1rem; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; border: 1px solid var(--c-border); }
  .ok { color: var(--c-ok); }
  .err { color: var(--c-err); }
  .hint { color: var(--c-muted); font-size: 0.85rem; }
</style>
</head>
<body>
<a class="brand" href="/">Recarga<em>Tica</em></a>
<h1 style="font-size:1.3rem;margin:0.5rem 0 1.25rem;color:var(--c-muted);">Panel administrativo</h1>

<section>
  <h2>Token de admin</h2>
  <p class="hint">Coincide con la env var ADMIN_TOKEN del servidor.</p>
  <input id="admin-token" placeholder="X-Admin-Token">
</section>

<section>
  <h2>Ajuste manual de wallet</h2>
  <label>User ID (UUID)
    <input id="user-id" placeholder="00000000-0000-0000-0000-000000000000">
  </label>
  <label>Nombre del operador (operator_name)
    <input id="operator" placeholder="Alonso">
  </label>
  <label>Monto en céntimos (positivo o negativo, distinto de 0)
    <input id="amount" type="number" placeholder="50000 (= ₡500.00)">
  </label>
  <label>Tipo de saldo
    <select id="kind">
      <option value="real" selected>real</option>
      <option value="promo">promocional</option>
    </select>
  </label>
  <label>Razón
    <input id="reason" placeholder="Bono de bienvenida">
  </label>
  <label>Idempotency-Key
    <input id="idem">
    <button type="button" onclick="genIdem()">generar uuid</button>
  </label>
  <button onclick="doAdjust()">Aplicar ajuste</button>
  <pre id="out"></pre>
</section>

<script>
const $ = id => document.getElementById(id);

function genIdem() {
  $('idem').value = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));
}

async function doAdjust() {
  const out = $('out');
  const userId = $('user-id').value.trim();
  if (!userId) { out.textContent = 'falta user id'; return; }
  const idem = $('idem').value.trim();
  if (!idem) { out.textContent = 'falta idempotency key'; return; }
  const tok = $('admin-token').value.trim();
  const r = await fetch(`/api/admin/wallet/${encodeURIComponent(userId)}/adjust`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Admin-Token': tok,
      'Idempotency-Key': idem,
    },
    body: JSON.stringify({
      amount_cents: parseInt($('amount').value, 10),
      kind: $('kind').value,
      reason: $('reason').value,
      operator_name: $('operator').value,
    }),
  });
  const text = await r.text();
  let body; try { body = JSON.parse(text); } catch { body = text; }
  out.className = r.status < 300 ? 'ok' : 'err';
  out.textContent = r.status + ' ' + JSON.stringify(body, null, 2);
}
</script>
</body>
</html>
